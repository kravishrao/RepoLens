# RepoLens Continuous Integration
#
# Triggers
# --------
# pull_request  – runs on every PR opened, synchronised, or reopened that
#                 targets the `develop` or `main` branch.
# push          – runs on direct pushes to `develop` and `main` (integration
#                 and release branches that are protected in the repository
#                 settings).
#
# Jobs
# ----
# code-quality  – formatting check (ruff format) and lint check (ruff check).
# test          – pytest suite, executed only when a tests/ directory exists.
#
# Branch-protection note
# ----------------------
# Once branch protection is enabled for `develop` and `main`, configure both
# `Code Quality Checks` and `Test Suite` as required status checks.  Failed
# checks will then block merging automatically.

name: RepoLens CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code-quality gate (Ruff formatting + lint)
  # ---------------------------------------------------------------------------
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Ruff checks only the RepoLens source tree so the bundled dataset
      # repositories (which may contain third-party code with different style
      # conventions) are never flagged.
      - name: Check code formatting (ruff format)
        run: ruff format --check src tests

      - name: Run lint checks (ruff check)
        run: ruff check src tests

  # ---------------------------------------------------------------------------
  # Job 2: Test suite (pytest) – skipped when no tests/ directory is present
  # ---------------------------------------------------------------------------
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # Keep the test job independent of code-quality so both results are always
    # visible in the PR status panel even when one job fails.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Install the RepoLens package in editable mode so imports resolve.
          pip install -e .

      - name: Check whether a test suite exists
        id: check-tests
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' | head -1)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pytest
        if: steps.check-tests.outputs.found == 'true'
        run: |
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -q
