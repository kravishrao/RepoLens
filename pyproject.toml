# =============================================================================
# RepoLens – project metadata and tool configuration
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "Static code-graph analysis for Python repositories."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
# Ruff – linter and formatter configuration
# =============================================================================
[tool.ruff]
# Target the same Python version used in CI.
target-version = "py311"

# Restrict Ruff to the RepoLens source tree; the bundled dataset repositories
# contain third-party code that should never be linted or reformatted.
include = ["src/**/*.py", "tests/**/*.py"]

line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line-length handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["repolens"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# pytest configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q --tb=short --strict-markers"
markers   = []
